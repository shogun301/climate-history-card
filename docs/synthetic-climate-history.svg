<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title description">
  <title id="title">Synthetic Climate History Card example</title>
  <desc id="description">A synthetic two-zone climate chart with continuous measured temperatures, stepped setpoints, equipment-active shading, an outside series, humidity, and command markers.</desc>
  <rect width="1200" height="620" rx="22" fill="#15181d"/>
  <text x="44" y="56" fill="#f3f4f6" font-family="system-ui,sans-serif" font-size="30">Climate and equipment history</text>
  <text x="44" y="84" fill="#9ca3af" font-family="system-ui,sans-serif" font-size="16">Synthetic data · measured values continuous · setpoints stepped</text>
  <g font-family="system-ui,sans-serif" font-size="14" fill="#cbd5e1">
    <circle cx="48" cy="119" r="5" fill="#3B82F6"/><text x="61" y="124">Office measured</text>
    <rect x="200" y="115" width="24" height="6" rx="2" fill="#1D4ED8"/><text x="233" y="124">Office setpoint</text>
    <circle cx="378" cy="119" r="5" fill="#F97316"/><text x="391" y="124">Studio measured</text>
    <rect x="530" y="115" width="24" height="6" rx="2" fill="#C2410C"/><text x="563" y="124">Studio setpoint</text>
    <circle cx="711" cy="119" r="5" fill="#A855F7"/><text x="724" y="124">Outside</text>
    <circle cx="817" cy="119" r="5" fill="#22A06B"/><text x="830" y="124">Humidity</text>
  </g>
  <rect x="70" y="158" width="1040" height="380" fill="#111318" stroke="#303640"/>
  <g stroke="#303640" stroke-width="1">
    <path d="M70 234H1110M70 310H1110M70 386H1110M70 462H1110"/>
    <path d="M243 158V538M416 158V538M590 158V538M763 158V538M936 158V538"/>
  </g>
  <g fill="#9ca3af" font-family="system-ui,sans-serif" font-size="13">
    <text x="24" y="166">78°F</text><text x="24" y="242">74°F</text><text x="24" y="318">70°F</text><text x="24" y="394">66°F</text><text x="24" y="470">62°F</text>
    <text x="1118" y="166">100%</text><text x="1118" y="356">50%</text><text x="1118" y="542">0%</text>
    <text x="70" y="570">12 AM</text><text x="391" y="570">8 AM</text><text x="741" y="570">4 PM</text><text x="1070" y="570">12 AM</text>
  </g>
  <path d="M70 378 C170 370 220 350 300 362 S420 410 500 385 S640 300 720 320 S850 370 930 342 S1030 300 1110 318 L1110 538 L70 538Z" fill="#3B82F6" opacity=".16"/>
  <path d="M70 378 C170 370 220 350 300 362 S420 410 500 385 S640 300 720 320 S850 370 930 342 S1030 300 1110 318" fill="none" stroke="#3B82F6" stroke-width="4"/>
  <path d="M70 414 C180 420 260 394 350 405 S520 438 610 400 S760 350 840 370 S1000 400 1110 376" fill="none" stroke="#F97316" stroke-width="4"/>
  <path d="M70 424 H350 V348 H760 V386 H1110" fill="none" stroke="#1D4ED8" stroke-width="7"/>
  <path d="M70 442 H500 V368 H900 V406 H1110" fill="none" stroke="#C2410C" stroke-width="7"/>
  <path d="M70 488 C230 470 360 420 500 330 S730 180 870 220 S1010 300 1110 290" fill="none" stroke="#A855F7" stroke-width="3"/>
  <path d="M70 310 C200 300 350 322 500 286 S760 260 900 280 S1040 250 1110 268" fill="none" stroke="#22A06B" stroke-width="4"/>
  <g stroke="#1D4ED8" stroke-width="2" stroke-dasharray="6 6"><path d="M350 158V538"/><path d="M760 158V538"/></g>
  <g fill="#1D4ED8"><path d="M350 151l7 9-7 9-7-9z"/><path d="M760 151l7 9-7 9-7-9z"/></g>
  <path d="M900 158V538" stroke="#C2410C" stroke-width="2" stroke-dasharray="3 6"/><path d="M900 151l8 16h-16z" fill="#C2410C"/>
  <text x="70" y="604" fill="#9ca3af" font-family="system-ui,sans-serif" font-size="13">Illustration only — no household or production data</text>
</svg>
